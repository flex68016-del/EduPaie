<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EduPaie" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FF0"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Fond : carré arrondi bleu (couleur principale de l'application) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Base du mortier (partie sous le plateau) -->
  <path d="M160 222 v62 c0 32 45 52 96 52 s96 -20 96 -52 v-62 l-96 46 z" fill="#BFDBFE"/>

  <!-- Plateau du mortier : symbole de l'école -->
  <polygon points="256,104 424,184 256,264 88,184" fill="#FFFFFF"/>

  <!-- Gland : cordon et pompon -->
  <line x1="410" y1="191" x2="410" y2="268" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="410" cy="282" r="14" fill="#FFFFFF"/>

  <!-- Pièce validée : symbole du paiement encaissé -->
  <circle cx="256" cy="398" r="60" fill="#16A34A" stroke="#FFFFFF" stroke-width="12"/>
  <path d="M228 398 l20 20 l38 -44" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
