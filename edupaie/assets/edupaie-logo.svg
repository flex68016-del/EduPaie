    <path d="M160 222 v62 c0 32 45 52 96 52 s96 -20 96 -52 v-62 l-96 46 z" fill="#BFDBFE"/>
    <polygon points="256,104 424,184 256,264 88,184" fill="#FFFFFF"/>
    <line x1="410" y1="191" x2="410" y2="268" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="410" cy="282" r="14" fill="#FFFFFF"/>
    <circle cx="256" cy="398" r="60" fill="#16A34A" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M228 398 l20 20 l38 -44" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nom : "Edu" en blanc, "Paie" en bleu clair (lisible sur fond #16233B) -->
