      <stop offset="0" stop-color="#2F6FF0"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Icône (même dessin que edupaie-icon.svg, réduite à 128 px) -->
  <g transform="scale(0.25)">
